name: Build OpenClicky

on:
  workflow_dispatch:
  push:
    branches:
      - feature/openclicky

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build OpenClicky
        run: |
          xcodebuild \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/OpenClickyDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          xcodebuild \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/OpenClickyDerivedData" \
            -only-testing:leanring-buddyTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Ad-hoc sign application
        run: |
          codesign \
            --force \
            --deep \
            --sign - \
            --entitlements leanring-buddy/leanring-buddy.entitlements \
            "$RUNNER_TEMP/OpenClickyDerivedData/Build/Products/Debug/OpenClicky.app"

      - name: Package application
        run: |
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$RUNNER_TEMP/OpenClickyDerivedData/Build/Products/Debug/OpenClicky.app" \
            "$RUNNER_TEMP/OpenClicky-Test-Build.zip"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: OpenClicky-Test-Build
          path: ${{ runner.temp }}/OpenClicky-Test-Build.zip
          if-no-files-found: error
          retention-days: 14
